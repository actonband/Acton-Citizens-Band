name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
      FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID }}
      REACT_APP_GOOGLE_ANALYTICS_TRACKING_ID: ${{ vars.REACT_APP_GOOGLE_ANALYTICS_TRACKING_ID }}
      REACT_APP_DRACO_DECODER_URI: https://www.gstatic.com/draco/versioned/decoders/1.5.6/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Validate Firebase configuration
        shell: bash
        run: |
          node <<'NODE'
          const required = ['FIREBASE_API_KEY', 'FIREBASE_AUTH_DOMAIN', 'FIREBASE_PROJECT_ID', 'FIREBASE_APP_ID'];
          const missing = required.filter(key => !process.env[key]);
          if (missing.length) throw new Error('Add these GitHub repository variables: ' + missing.join(', '));
          if (process.env.FIREBASE_PROJECT_ID !== 'acton-citizens-band') throw new Error('FIREBASE_PROJECT_ID must be acton-citizens-band');
          NODE
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ACTON_CITIZENS_BAND }}
          projectId: acton-citizens-band
