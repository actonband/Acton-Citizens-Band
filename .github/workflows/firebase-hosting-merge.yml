name: Deploy website and account services on merge
on:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: firebase-production
  cancel-in-progress: false
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
      FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID }}
      REACT_APP_GOOGLE_ANALYTICS_TRACKING_ID: ${{ vars.REACT_APP_GOOGLE_ANALYTICS_TRACKING_ID }}
      REACT_APP_DRACO_DECODER_URI: https://www.gstatic.com/draco/versioned/decoders/1.5.6/
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Validate Firebase configuration
        shell: bash
        run: |
          node <<'NODE'
          const required = ['FIREBASE_API_KEY', 'FIREBASE_AUTH_DOMAIN', 'FIREBASE_PROJECT_ID', 'FIREBASE_APP_ID'];
          const missing = required.filter(key => !process.env[key]);
          if (missing.length) throw new Error('Add these GitHub repository variables: ' + missing.join(', '));
          if (process.env.FIREBASE_PROJECT_ID !== 'acton-citizens-band') throw new Error('FIREBASE_PROJECT_ID must be acton-citizens-band');
          NODE
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - run: node functions/index.cjs
      - run: node --test tests/account-deletion.test.mjs
      - run: node --test tests/admin-users.test.mjs
      - run: node --test tests/registration.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ACTON_CITIZENS_BAND }}
      - run: npm install --global firebase-tools@15.34.1
      - name: Deploy dashboard Firestore rules
        run: firebase deploy --only firestore:rules --project acton-citizens-band --non-interactive
      - name: Deploy retryable account cleanup
        run: firebase deploy --only functions:dashboard-accounts:cleanupDeletedDashboardAccount --project acton-citizens-band --non-interactive --force
      - name: Deploy account deletion endpoint
        run: firebase deploy --only functions:dashboard-accounts:deleteDashboardAccount --project acton-citizens-band --non-interactive
      - name: Deploy administrator account management
        run: firebase deploy --only functions:dashboard-accounts:manageDashboardUser --project acton-citizens-band --non-interactive
      - name: Deploy verified account setup
        run: firebase deploy --only functions:dashboard-accounts:dashboardRegistration --project acton-citizens-band --non-interactive
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ACTON_CITIZENS_BAND }}
          channelId: live
          projectId: acton-citizens-band
