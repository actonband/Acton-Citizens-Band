<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        try {
          var saved = localStorage.getItem('acb-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch (error) { /* Follow the device preference when storage is unavailable. */ }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Dashboard | Acton Citizens' Band</title>
    <link rel="icon" type="image/svg+xml" href="/img/branding/ACB-Brand-Mark-Red-Transparent.svg" />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
