<!DOCTYPE html>
<html lang="en-CA" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        var theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        try {
          var saved = localStorage.getItem('acb-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch (error) { /* Follow the device preference when storage is unavailable. */ }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <title>Acton Citizens' Band | Community Concert &amp; Marching Band, Ontario</title>
    <meta name="description" content="Community music in Acton, Ontario since 1872. Discover our concerts, join the band, or learn an instrument with free lessons and instrument loans." />
